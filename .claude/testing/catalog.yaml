# Studio — Skill & Agent Testing Catalog
#
# Master registry for skills and agents. Tracks coverage of behavioral specs
# (skills/<category>/<name>.md), category rubric checks, and static linter
# pass results. Used by /skill-test (static / spec / category / audit) and
# /skill-improve.
#
# Replaces the CCGS Skill Testing Framework that shipped at "CCGS Skill Testing
# Framework/catalog.yaml" — rebuilt minimal against Studio's discipline-
# collapsed roster. Specs are authored on demand; the catalog tracks coverage
# state.
#
# To populate: copy templates/skill-test-spec.md or templates/agent-test-spec.md,
# author the spec at the path listed below, then run /skill-test spec <name>
# to validate. Coverage fields (last_static, last_spec, last_category) update
# automatically.

version: 1
last_updated: 2026-04-28

